<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>출석 관리</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f5;color:#142c3e;font-family:'Malgun Gothic',sans-serif}main{max-width:1100px;margin:auto;padding:36px 24px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}h1{font-size:27px;margin:6px 0}small{color:#6c7f88}.layout{display:grid;grid-template-columns:300px 1fr;gap:24px}section{background:#fff;border-radius:14px;padding:22px}h2{font-size:17px;margin:0 0 18px}label{font-size:13px;display:block;margin:12px 0 6px}input,select,button{font:inherit;border-radius:8px;padding:10px;border:1px solid #d6dfdf}input,select{width:100%}button{cursor:pointer;background:#176c64;color:#fff;border:0}button:disabled{opacity:.5}#create{width:100%;margin-top:16px}#qr{width:100%;margin-top:16px}#message{font-size:13px;min-height:20px;color:#a23d35}.hint{font-size:12px;color:#637b83;line-height:1.6}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:12px 7px;text-align:left;border-bottom:1px solid #e3e9e9}tbody tr{cursor:pointer}tbody tr:hover{background:#f0f6f5}.scroll{overflow:auto}#details{margin-top:20px;border-top:1px solid #dce4e4;padding-top:16px}#photo{max-width:100%;max-height:260px;border-radius:8px}pre{white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:12px;line-height:1.7}.actions{display:flex;gap:8px;margin-top:12px}.actions button{font-size:12px}summary{font-size:12px;cursor:pointer;margin-top:12px}textarea{width:100%;height:90px;margin-top:8px;font-size:11px} @media(max-width:760px){.layout{grid-template-columns:1fr}}
dialog{border:0;border-radius:16px;padding:28px;width:min(1000px,94vw);max-height:90vh;color:inherit}dialog::backdrop{background:#142c3e88}.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.image-pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}.image-pair img{width:100%;height:260px;object-fit:contain;background:#f4f6f7}.metrics{padding:14px;background:#eff5f4;border-radius:10px;margin:16px 0;line-height:1.8} [hidden]{display:none!important} #qr-screen{position:fixed;inset:0;z-index:1000;background:white;display:flex;align-items:center;justify-content:center}#qr-screen img{width:min(94vw,94vh);height:min(94vw,94vh);object-fit:contain;image-rendering:pixelated}#qr-screen button{position:absolute;right:12px;top:12px;background:#eee;color:#222}</style></head><body><main>
<header><div><small>ATTENDANCE · ADMIN</small><h1>출석 관리</h1></div><small id="health">연결 중</small></header>
<div class="layout"><section><h2>출석 세션</h2><label for="place">장소 ID</label><input id="place" value="room-101" maxlength="80"><button id="create">QR 발급</button><p id="message" role="status"></p><img id="qr" alt="출석 QR" hidden><button id="qr-full" hidden>QR 전체 화면</button><p id="session" class="hint"></p><div class="actions"><button id="close" hidden>세션 종료</button></div><label for="sessions">기존 세션</label><select id="sessions"><option value="">선택</option></select></section>
<section><h2>인증 현황</h2><div class="scroll"><table><thead><tr><th>학생</th><th>상태</th><th>중계</th><th>장소</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></div></main>
<script>
const $=id=>document.getElementById(id);let active=null,items=[],selected=null;
async function api(path,body){const r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-Attendance-Admin':'1'},body:JSON.stringify(body)});if(!r.ok){const d=await r.json();throw Error(typeof d.detail==='string'?d.detail:'요청을 확인하세요')}return r.json()}
function displaySession(id,text){active=id;$('qr').src=`/api/sessions/${id}/qr`;$('qr').hidden=false;$('qr-full').hidden=false;$('close').hidden=false;$('session').textContent='';}
$('qr').onerror=()=>{$('qr').hidden=true;$('qr-full').hidden=true;$('session').textContent='종료된 세션'};
$('create').onclick=async()=>{try{$('create').disabled=true;qrScreen.querySelector('img').hidden=true;qrScreen.hidden=false;qrScreen.requestFullscreen?.().catch(()=>{});const p=await api('/api/sessions',{place_id:$('place').value.trim()});displaySession(p.session_id,p.place_id);qrScreen.querySelector('img').src=$('qr').src;qrScreen.querySelector('img').hidden=false;$('message').textContent='';await loadSessions()}catch(e){closeQr();$('message').textContent=e.message}finally{$('create').disabled=false}};
$('close').onclick=async()=>{if(!active)return;try{await api(`/api/sessions/${active}/close`,{});$('qr').hidden=true;$('qr-full').hidden=true;$('close').hidden=true;$('session').textContent='세션 종료';active=null;await loadSessions()}catch(e){$('message').textContent=e.message}};
async function loadSessions(){const data=await api('/api/sessions');$('sessions').replaceChildren(new Option('선택',''));for(const s of data){if(s.active)$('sessions').append(new Option(`${s.place_id} · ${new Date(s.created_at).toLocaleTimeString()}`,s.session_id))}}
$('sessions').onchange=()=>{if($('sessions').value){displaySession($('sessions').value,$('sessions').selectedOptions[0].text);}};
const statuses={processing:'측정 중',complete:'완료',error:'오류',interrupted:'연결 종료'};
function detail(a){selected=a.attempt_id;openPlaceDetail(a)}
function relayLabel(p){return p?`${({within_bound:'통과',suspected:'의심',not_configured:'미설정'})[p.status]||'판정 불가'} (${p.rtt_ms.toFixed(3)} ms)`:'—'}
async function refresh(){try{items=await api('/api/attempts');$('rows').replaceChildren();for(const a of items){const tr=document.createElement('tr');for(const value of [a.student_id,a.result?.decision==='approved'?'승인':a.status==='complete'?'추가 확인':statuses[a.status]||a.status,relayLabel(a.result?.relay),a.result?.place?.decision||'—']){const td=document.createElement('td');td.textContent=value;tr.append(td)}const cell=document.createElement('td'),button=document.createElement('button');button.textContent='상세';button.onclick=()=>detail(a);cell.append(button);tr.append(cell);$('rows').append(tr)}const a=items.find(x=>x.attempt_id===selected);if(a)updatePlaceDetail(a);$('health').textContent='서버 연결됨'}catch{$('health').textContent='서버 연결 끊김'}finally{setTimeout(refresh,2000)}}
const qrScreen=document.createElement('div');qrScreen.id='qr-screen';qrScreen.hidden=true;qrScreen.innerHTML='<img alt="인증 QR"><button>닫기</button>';document.body.append(qrScreen);
$('qr-full').onclick=()=>{if(!active)return;qrScreen.querySelector('img').hidden=false;qrScreen.querySelector('img').src=$('qr').src;qrScreen.hidden=false;qrScreen.requestFullscreen?.().catch(()=>{})};
function closeQr(){qrScreen.hidden=true;if(document.fullscreenElement===qrScreen)document.exitFullscreen().catch(()=>{})}
qrScreen.querySelector('button').onclick=closeQr;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeQr()});
loadSessions().catch(e=>$('message').textContent=e.message);refresh();
</script><script src="/admin-place.js"></script><script src="/admin-calibration.js"></script></body></html>
